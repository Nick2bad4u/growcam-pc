# Prettier would quote Codecov's boolean-like `off` sentinel and change its
# meaning, so this file is intentionally listed in .prettierignore.
codecov:
    branch: "main"
    # CI generates and explicitly uploads this report. Keep expiry disabled
    # because Codecov can otherwise reject a fresh coverage.py timestamp as
    # older than its default 12-hour window.
    max_report_age: off
    require_ci_to_pass: true
    notify:
        # Wait for the workflow conclusion before applying require_ci_to_pass.
        wait_for_ci: true

coverage:
    precision: 2
    round: "down"
    range: "60..100"
    status:
        project:
            default:
                target: "60%"
                threshold: "0%"
                flags:
                    - "python"
        patch:
            default:
                target: "80%"
                threshold: "0%"
                flags:
                    - "python"

flags:
    python:
        paths:
            - "src/growcam/"

github_checks:
    annotations: true
