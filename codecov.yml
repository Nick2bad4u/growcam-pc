codecov:
    branch: "main"
    # CI generates and explicitly uploads this report. Keep expiry disabled
    # because Codecov can otherwise reject a fresh coverage.py timestamp as
    # older than its default 12-hour window.
    max_report_age: "off"
    require_ci_to_pass: true

coverage:
    precision: 2
    round: "down"
    range: "60..100"
    status:
        project:
            default:
                target: "60%"
                threshold: "0%"
                flags:
                    - "python"
        patch:
            default:
                target: "80%"
                threshold: "0%"
                flags:
                    - "python"

flags:
    python:
        paths:
            - "src/growcam/"

github_checks:
    annotations: true
