codecov:
  branch: main
  # CI generates and explicitly uploads this report; Codecov currently
  # misclassifies its fresh coverage.py timestamp as older than 12 hours.
  max_report_age: off
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: 60..100
  status:
    project:
      default:
        target: auto
        threshold: 1%
        flags:
          - python
    patch:
      default:
        target: 80%
        threshold: 0%
        flags:
          - python

comment:
  layout: reach,diff,flags,files
  behavior: default
  require_changes: true

flags:
  python:
    paths:
      - src/growcam/
    carryforward: false

github_checks:
  annotations: true
