name: "CI"

on:
    push:
        branches:
            - "main"
    pull_request:
    workflow_dispatch:

permissions:
    contents: "read"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

jobs:
    quality:
        name: "Python quality and package"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        permissions:
            contents: "read"
            id-token: "write"
        steps:
            - name: "Check out repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0

            - name: "Set up Python"
              uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
              with:
                  python-version: "3.11"

            - name: "Set up uv"
              uses: "astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d" # v10.0.1
              with:
                  version: "0.11.26"
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
                  cache-suffix: "quality"

            - name: "Install locked dependencies"
              run: "uv sync --frozen --all-groups --no-install-project --no-build"

            - name: "Check formatting"
              run: "uv run --no-sync --no-build ruff format --check ."

            - name: "Lint"
              run: "uv run --no-sync --no-build ruff check ."

            - name: "Type-check with mypy"
              run: "uv run --no-sync --no-build mypy"

            - name: "Type-check with Pyright"
              run: "uv run --no-sync --no-build pyright"

            - name: "Compile"
              run: "uv run --no-sync --no-build python -m compileall -q src tests"

            - name: "Test with branch coverage"
              run: >-
                  uv run --no-sync --no-build pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=coverage/pytest/junit.xml

            - name: "Analyze with SonarQube Cloud"
              if: "${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}"
              uses: "SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f" # v8.2.1
              env:
                  SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}"

            - name: "Upload Python coverage to Codecov"
              if: "${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  files: "coverage/python/coverage.xml"
                  flags: "python"
                  name: "python-coverage"
                  report_type: "coverage"
                  disable_search: true
                  fail_ci_if_error: true
                  verbose: true

            - name: "Upload Python test results to Codecov"
              if: "${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}"
              uses: "codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3" # v1.2.1
              with:
                  use_oidc: true
                  files: "coverage/pytest/junit.xml"
                  flags: "python"
                  name: "python-tests"
                  disable_search: true
                  fail_ci_if_error: true
                  verbose: true

            - name: "Preserve test reports"
              if: "${{ !cancelled() }}"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.0
              with:
                  name: "python-test-reports"
                  path: "coverage/"
                  if-no-files-found: "error"
                  retention-days: 14

            - name: "Build distributions"
              run: "uv build --clear"

            - name: "Validate distributions"
              run: "uv run --no-sync --no-build twine check dist/*"

    compatibility:
        name: "${{ matrix.os }} / Python ${{ matrix.python }}"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: "ubuntu-latest"
                      python: "3.11"
                    - os: "ubuntu-latest"
                      python: "3.12"
                    - os: "ubuntu-latest"
                      python: "3.13"
                    - os: "ubuntu-latest"
                      python: "3.14"
                    - os: "windows-latest"
                      python: "3.11"
                    - os: "macos-latest"
                      python: "3.11"
        steps:
            - name: "Check out repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Set up Python"
              uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
              with:
                  python-version: "${{ matrix.python }}"

            - name: "Set up uv"
              uses: "astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d" # v10.0.1
              with:
                  version: "0.11.26"
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
                  cache-suffix: "${{ matrix.os }}-py${{ matrix.python }}"

            - name: "Install locked dependencies"
              run: "uv sync --frozen --all-groups --no-install-project --no-build"

            - name: "Test"
              run: "uv run --no-sync --no-build pytest -q"

            - name: "Build wheel"
              run: "uv build --wheel --clear"

            - name: "Smoke-test installed command"
              run: >-
                  uv run --no-sync --no-build python -c "import runpy, sys; sys.argv[0] = 'growcam'; sys.path.insert(0, 'dist/growcam_pc-1.3.0-py3-none-any.whl'); runpy.run_module('growcam', run_name='__main__')" --version

    documentation:
        name: "Documentation and repository tooling"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        steps:
            - name: "Check out repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0

            - name: "Set up Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version: "24"
                  cache: "npm"

            - name: "Install locked dependencies"
              run: "npm ci --ignore-scripts"

            - name: "Check JavaScript and repository files"
              run: "npm run lint:js"

            - name: "Check stylesheets"
              run: "npm run lint:stylelint"

            - name: "Check package metadata"
              run: "npm run lint:package-json"

            - name: "Check Markdown"
              run: "npm run lint:remark"

            - name: "Scan repository secrets"
              run: "npm run lint:secretlint"

            - name: "Scan repository history for secrets"
              uses: "gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e" # v3.0.0
              env:
                  GITHUB_TOKEN: "${{ github.token }}"
                  GITLEAKS_CONFIG: ".gitleaks.toml"
                  GITLEAKS_ENABLE_COMMENTS: "false"

            - name: "Validate changelog generation"
              run: "npm run changelog:preview:offline"

            - name: "Check links"
              id: "lychee"
              uses: "lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8" # v2.9.0
              with:
                  # Docusaurus combines this origin with baseUrl; the origin alone is not a deployed page.
                  # PyPI can rate-limit automated checks. The new C4 guide is deployed by
                  # this push, and the v1.3.0 compare URLs are created by the tagged release.
                  args: >-
                      --config node_modules/lychee-config-nick2bad4u/lychee.toml --exclude '^.*pypi[.]org/project/growcam-pc/?$' --exclude '^https://nick2bad4u[.]github[.]io/?$' --exclude '^https://nick2bad4u[.]github[.]io/growcam-pc/docs/growcam-c4-setup/?$' --exclude '^.*github[.]com/Nick2bad4u/growcam-pc/compare/v1[.]2[.]1[.][.][.]v1[.]3[.]0$' --exclude '^.*github[.]com/Nick2bad4u/growcam-pc/compare/v1[.]3[.]0[.][.][.]HEAD$' README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md website
                  fail: true
              env:
                  GITHUB_TOKEN: "${{ github.token }}"

            - name: "Build documentation site"
              run: "npm run docs:build"
