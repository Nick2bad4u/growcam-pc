name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.26

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(uv run python -c 'from growcam import __version__; print(__version__)')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Validate release
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pyright
          uv run pytest

      - name: Build distributions
        run: uv build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "GrowCam PC ${GITHUB_REF_NAME}"
