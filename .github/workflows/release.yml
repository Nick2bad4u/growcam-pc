name: "Release"

on:
    push:
        tags:
            - "v[0-9]*.[0-9]*.[0-9]*"

jobs:
    build:
        name: "Verify and build distributions"
        runs-on: "ubuntu-latest"
        timeout-minutes: 25
        permissions:
            contents: "read"
        steps:
            - name: "Check out repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: "Set up Python"
              uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
              with:
                  python-version: "3.11"

            - name: "Set up uv"
              uses: "astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa" # v10.3.1
              with:
                  version: "0.11.26"

            - name: "Set up Node.js"
              uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
              with:
                  node-version: "24"
                  cache: "npm"

            - name: "Install locked dependencies"
              run: |
                  uv sync --frozen --all-groups
                  npm ci --ignore-scripts

            - name: "Verify release tag"
              shell: "bash"
              run: |
                  package_version="$(uv run python -c 'from growcam import __version__; print(__version__)')"
                  test "v${package_version}" = "${GITHUB_REF_NAME}"

            - name: "Validate release"
              run: "npm run release:verify"

            - name: "Upload distributions"
              uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.0
              with:
                  name: "python-distributions"
                  path: "dist/*"
                  if-no-files-found: "error"
                  retention-days: 14

    release:
        name: "Publish GitHub release"
        needs: "build"
        runs-on: "ubuntu-latest"
        timeout-minutes: 15
        permissions:
            contents: "write"
        steps:
            - name: "Check out repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0

            - name: "Set up Node.js"
              uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
              with:
                  node-version: "24"
                  cache: "npm"

            - name: "Install changelog tooling"
              run: "npm ci --ignore-scripts"

            - name: "Generate release notes"
              run: |
                  mkdir -p .cache
                  npm run changelog:release-notes:file
              env:
                  GITHUB_TOKEN: "${{ github.token }}"

            - name: "Download distributions"
              uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
              with:
                  name: "python-distributions"
                  path: "dist"

            - name: "Create or update GitHub release"
              shell: "bash"
              env:
                  GH_TOKEN: "${{ github.token }}"
              run: |
                  if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
                    gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
                    gh release edit "${GITHUB_REF_NAME}" --notes-file .cache/release-notes.md --title "GrowCam PC ${GITHUB_REF_NAME}"
                  else
                    gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --notes-file .cache/release-notes.md --title "GrowCam PC ${GITHUB_REF_NAME}"
                  fi

    publish:
        name: "Publish to PyPI"
        needs:
            - "build"
            - "release"
        runs-on: "ubuntu-latest"
        timeout-minutes: 10
        permissions:
            id-token: "write"
        environment:
            name: "pypi"
            url: "https://pypi.org/project/growcam-pc/"
        steps:
            - name: "Download distributions"
              uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
              with:
                  name: "python-distributions"
                  path: "dist"

            - name: "Publish distributions"
              uses: "pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086" # v1.14.3
              with:
                  packages-dir: "dist/"
                  skip-existing: true
                  verbose: true
