version: 2
updates:
    - package-ecosystem: "uv"
      directory: "/"
      schedule:
          interval: "weekly"
      reviewers:
          - "Nick2bad4u"
      groups:
          python-dependencies:
              patterns:
                  - "*"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      reviewers:
          - "Nick2bad4u"
      groups:
          github-actions:
              patterns:
                  - "*"
