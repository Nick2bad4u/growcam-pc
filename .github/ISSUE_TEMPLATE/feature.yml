name: "Feature request"
description: "Suggest a focused improvement."
title: "[Feature]: "
labels:
    - "enhancement"
body:
    - type: "textarea"
      id: "problem"
      attributes:
          label: "Problem to solve"
          description: "Describe the workflow or limitation, not only the proposed implementation."
      validations:
          required: true
    - type: "textarea"
      id: "proposal"
      attributes:
          label: "Proposed behavior"
      validations:
          required: true
    - type: "textarea"
      id: "alternatives"
      attributes:
          label: "Alternatives considered"
