# SonarQube Cloud project identity
sonar.organization=nick2bad4u
sonar.projectKey=Nick2bad4u_growcam-pc
sonar.projectName=growcam-pc
sonar.host.url=https://sonarcloud.io

# Analyze shipped Python and static dashboard assets as source. Keep tests in a
# separate scope so they do not affect production duplication or coverage.
sonar.sources=src/growcam
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.exclusions=**/__pycache__/**
sonar.cpd.exclusions=tests/**/*.py
sonar.coverage.exclusions=src/growcam/static/**

# Match the supported interpreter matrix declared by the package and CI.
sonar.python.version=3.11,3.12,3.13,3.14

# CI-based analysis imports the reports already produced by pytest-cov/pytest.
# CI-based analysis is required because automatic analysis cannot import Python
# coverage or test-execution reports.
sonar.python.coverage.reportPaths=coverage/python/coverage.xml
sonar.python.xunit.reportPath=coverage/pytest/junit.xml

sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.qualitygate.wait=true
