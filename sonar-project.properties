sonar.projectKey=Nick2bad4u_growcam-pc
sonar.organization=nick2bad4u
sonar.projectName=growcam-pc

sonar.sources=src,website,.github
sonar.tests=tests
sonar.python.version=3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage/python/coverage.xml
sonar.python.xunit.reportPath=coverage/pytest/junit.xml

# The repository's executable coverage gate is Python-only. Browser assets and
# Docusaurus pages remain in Sonar static analysis and are build-checked in CI.
sonar.coverage.exclusions=src/growcam/static/**,website/**
sonar.exclusions=website/build/**,website/static/img/**/*.png,node_modules/**,dist/**,.cache/**
sonar.sourceEncoding=UTF-8
