[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "growcam-pc"
version = "0.1.0"
description = "Local PC access tools for VIVOSUN GrowCam cameras"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick2bad4u" }]
keywords = ["camera", "dvrip", "growcam", "rtsp", "timelapse", "vivosun"]
requires-python = ">=3.11"
dependencies = ["typing-extensions>=4.16,<5"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/Nick2bad4u/growcam-pc"
Issues = "https://github.com/Nick2bad4u/growcam-pc/issues"
Repository = "https://github.com/Nick2bad4u/growcam-pc"

[dependency-groups]
dev = [
  "mypy==2.1.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.15.20",
]

[project.scripts]
growcam = "growcam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
growcam = ["py.typed", "static/*.css", "static/*.html", "static/*.js", "static/*.svg"]

[tool.ruff]
required-version = "==0.15.20"
target-version = "py311"
line-length = 120
src = ["src", "tests"]
force-exclude = true
output-format = "concise"
show-fixes = true
respect-gitignore = true
cache-dir = ".cache/.ruff_cache"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.analyze]
detect-string-imports = true
direction = "dependencies"
type-checking-imports = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401", # Protocol and decoded-JSON boundaries are intentionally dynamic.
  "COM812", # Conflicts with the formatter.
  "D203",   # Prefer no blank line before a class docstring.
  "D213",   # Prefer summary on the first docstring line.
  "EM101",  # Boundary exceptions deliberately carry inline operational detail.
  "EM102",  # Boundary exceptions deliberately carry inline operational detail.
  "ISC001", # Conflicts with the formatter.
  "TRY003", # Boundary exceptions deliberately carry operational detail.
]
unfixable = ["ERA001", "F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.per-file-ignores]
"src/growcam/cli.py" = ["DTZ005", "PLR0912", "T201", "TRY300"]
"src/growcam/dvrip.py" = ["C901", "DTZ007", "PLR0912", "PLR0915"]
"src/growcam/media.py" = ["S603"]
"src/growcam/web.py" = ["DTZ005"]
"tests/**/*.py" = ["D103", "DTZ001", "PLR2004", "S101", "SLF001"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
disallow_any_decorated = true
disallow_any_unimported = true
strict_bytes = true
strict_equality = true
strict_equality_for_none = true
show_error_codes = true
show_column_numbers = true
pretty = false
warn_incomplete_stub = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
cache_dir = ".cache/.mypy_cache"
enable_error_code = [
  "deprecated",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "build", "dist", "output"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
pythonPlatform = "All"
analyzeUnannotatedFunctions = true
strictDictionaryInference = true
strictListInference = true
strictSetInference = true
enableReachabilityAnalysis = true
deprecateTypingAliases = true
disableBytesTypePromotions = true
useLibraryCodeForTypes = true
reportMissingTypeStubs = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportUnusedCallResult = true
reportImplicitOverride = true
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
minversion = "9.1"
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".cache/.pytest_cache"
